<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="type-label">—</div>
  <div id="character">—</div>
<div class="btn-row">
  <button id="next-btn" onclick="next()">Next</button>
  <button id="show-btn" onclick="show()">Show</button>
</div>

  <script src="data.js"></script>
  <script>
    const types = ["hiragana", "katakana", "kanji"];
	let typeIndex = Math.floor(Math.random() * types.length);
	let lastCharIndex = -1;

	function show() {
	  const pool = characters.filter(c => c.type === types[(typeIndex - 1) % types.length]);
	  const pair = pool[lastCharIndex].pair;
	  const el = document.getElementById("character");
	  el.textContent = pair;
	  el.style.fontSize = pair.length > 3 ? "15vw" : "30vw";
	  document.getElementById("show-btn").disabled = true;
	}


	function next() {
	  const currentType = types[typeIndex % types.length];
	  const pool = characters.filter(c => c.type === currentType);

	  let idx;
	  do { idx = Math.floor(Math.random() * pool.length); }
	  while (idx === lastCharIndex && pool.length > 1);

	  lastCharIndex = idx;
	  typeIndex++;

	  document.getElementById("character").textContent = pool[idx].char;
	  document.getElementById("type-label").textContent = currentType;
	  
	   document.getElementById("show-btn").disabled = false;
	   document.getElementById("character").style.fontSize = "30vw";
	}

next();
  </script>

</body>
</html>
